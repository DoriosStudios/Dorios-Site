name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
      - '!website/src/data/githubReleaseStats.json'
      - '!website/src/data/curseForgeStats.json'
      - '!website/scripts/collect-project-stats.mjs'
      - '!website/scripts/refresh-github-release-stats.mjs'
      - '!website/scripts/refresh-curseforge-stats.mjs'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
      - '!website/src/data/githubReleaseStats.json'
      - '!website/src/data/curseForgeStats.json'
      - '!website/scripts/collect-project-stats.mjs'
      - '!website/scripts/refresh-github-release-stats.mjs'
      - '!website/scripts/refresh-curseforge-stats.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dorios-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Cache pinned vanilla and addon render sources
        uses: actions/cache@v4
        with:
          path: |
            website/.cache-loader/vanilla
            website/.cache-loader/wiki-render-sources
          key: wiki-sources-${{ runner.os }}-${{ hashFiles('website/scripts/vanilla-source.config.json', 'website/scripts/wiki-visual-sources.config.json') }}

      - name: Cache generated entity renders
        uses: actions/cache@v4
        with:
          path: |
            website/static/img/wiki/utilitycraft/auto-entities
            website/static/img/wiki/ascendant-technology/auto-entities
          key: entity-renders-${{ runner.os }}-${{ hashFiles('website/scripts/bedrock-*.mjs', 'website/scripts/generate-bedrock-entity-renders.mjs', 'website/scripts/wiki-visual-sources.config.json') }}

      - name: Verify wiki and CPU visual pipelines
        working-directory: website
        run: npm run test:wiki && npm run test:bedrock-renders && npm run test:entity-renders && npm run test:vanilla-assets && npm run test:visual-pipeline

      - name: Prepare pinned wiki entity visuals
        working-directory: website
        run: npm run prepare:wiki-visuals -- --download-sources

      - name: Checkout Atelier builder source
        uses: actions/checkout@v4
        with:
          repository: DoriosStudios/Dorios-Atelier
          ref: main
          path: atelier-source

      - name: Install Atelier compiler dependencies
        working-directory: atelier-source
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          TERSER_PARALLEL: 2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATELIER_PROJECT_PATH: ${{ github.workspace }}/atelier-source
          DOWNLOAD_COUNTER_URL: ${{ vars.DOWNLOAD_COUNTER_URL }}

      - name: Verify deploy artifact
        shell: bash
        run: |
          test -f website/build/index.html
          test -f website/build/CNAME

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorios-site-build
          path: website/build
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: dorios-site-build
          path: website/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
